name: release

# tag 触发：vX.Y.Z → 测试通过后自动发布 npm。
# 发布用 npm Trusted Publishing（OIDC），不再需要 NPM_TOKEN 长期令牌。
# 前置：npmjs.com → 该包 Settings → Trusted publishing → 添加 GitHub Actions：
#   Organization or user: lhwwxy
#   Repository:           dsh-agentic-router
#   Workflow file name:   release.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC：npm 据此换取一次性发布凭证

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 24 自带 npm 11.x（trusted publishing 需 >= 11.5.1）
      # 不要设 registry-url：它会写入 _authToken=${NODE_AUTH_TOKEN}，空令牌会挡住 OIDC
      - run: npm publish
